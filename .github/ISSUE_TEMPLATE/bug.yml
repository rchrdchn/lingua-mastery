name: Bug
description: Something in the practice app or site does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Steps to reproduce, the page URL, and what you expected. }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser and device }
  - type: textarea
    id: console
    attributes: { label: Console errors, description: Optional. Do not paste your exported progress file if it has anything private in it. }
